{{define "content"}}
<h1>Logs: <a href="/clusters/{{.Data.Cluster}}">{{.Data.Cluster}}</a></h1>
<p class="muted">Known secret values are redacted in this view; the files on disk are not.</p>
{{range .Data.Dirs}}
<h2>{{.TS}}</h2>
<ul>{{$ts := .TS}}{{range .Files}}<li><a href="/clusters/{{$.Data.Cluster}}/logs/{{$ts}}/{{.}}">{{.}}</a></li>{{end}}</ul>
{{else}}<p>No logs yet.</p>{{end}}
{{end}}
