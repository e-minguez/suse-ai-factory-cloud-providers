{{define "content"}}
<p class="crumbs"><a href="/profiles">Profiles</a> / {{providerName .Data.Provider}}</p>
<div class="page-head">
  <div>
    <h1>Profile: {{template "provider" .Data.Provider}}</h1>
    <p class="meta">Stored values are never shown. Leave a field empty to keep the stored value.</p>
  </div>
</div>
<form method="post" action="/profiles/{{.Data.Provider}}" class="stack" autocomplete="off" data-once>
  {{range .Data.Fields}}
  <label>
    <span>{{.Label}} {{if index $.Data.Status .Name}}<span class="badge set">set</span>{{else}}<span class="badge unset">not set</span>{{end}}</span>
    {{if eq .Widget "text"}}<textarea name="{{.Name}}" rows="10" spellcheck="false" autocomplete="off"></textarea>
    {{else}}<input type="password" name="{{.Name}}" autocomplete="new-password" spellcheck="false">{{end}}
    <small>{{.Help}}</small>
  </label>
  {{end}}
  <div class="actions"><button type="submit">Save</button> <a href="/profiles">Cancel</a></div>
</form>
{{end}}
