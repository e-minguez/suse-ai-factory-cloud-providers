name: PR title

# Squash merges use the PR title as the commit message; release-please only
# sees Conventional Commits, so a non-conforming title is left out of the
# CHANGELOG and the version bump.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-26.04
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            deps
            build
            ci
            test
            style
            chore
          requireScope: false
