---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 1.16.5 fixes the evroc crash (hashicorp/terraform#39283) but is not
  # released yet. Bump this and drop the crash workaround in
  # scripts/lib/tf.sh once it ships -- see docs/workarounds.md.
  TF_VERSION: "1.16.4"

jobs:
  fmt-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: make fmt-check

  validate:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, evroc, exoscale, vultr]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: make validate EXAMPLES=examples/${{ matrix.provider }} TOOL_ROOTS=

  validate-tools:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: make validate EXAMPLES=

  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint-sh

  tflint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - run: make lint-tf

  check-consistency:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make check-consistency

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: make test

  go-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/cost/go.mod
          cache-dependency-path: tools/cost/go.sum
      - run: make test-go

  webui-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/webui/go.mod
          cache-dependency-path: |
            tools/webui/go.sum
            tools/cost/go.sum
      - run: make test-webui

  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: tools/webui/Dockerfile
          config: .hadolint.yaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/webui/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: suse-ai-factory-cloud-providers:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --init --name aif -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp suse-ai-factory-cloud-providers:ci
          trap 'docker logs aif; docker rm -f aif' EXIT
          for _ in $(seq 1 30); do
            [ "$(curl -s http://127.0.0.1:8080/healthz)" = ok ] && break
            sleep 1
          done
          [ "$(curl -s http://127.0.0.1:8080/healthz)" = ok ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 403 ]
          docker exec aif terraform version
          docker exec aif aws --version
          docker exec aif evroc version

  docs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install terraform-docs
        run: |
          curl -sSLo tfdocs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          echo "9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3  tfdocs.tar.gz" | sha256sum -c -
          tar -xzf tfdocs.tar.gz terraform-docs && rm tfdocs.tar.gz
          sudo mv terraform-docs /usr/local/bin/
      - run: make docs-check
