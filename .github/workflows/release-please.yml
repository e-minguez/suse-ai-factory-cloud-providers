name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write # tags, releases, CHANGELOG.md on the release branch
  pull-requests: write # release PR
  issues: write # release labels (googleapis/release-please-action#1105)

jobs:
  release-please:
    runs-on: ubuntu-26.04
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # PRs opened with GITHUB_TOKEN do not trigger CI, so the required checks
      # never run on the release PR. RELEASE_PLEASE_TOKEN (PAT or app token)
      # avoids that; without it, close and reopen the release PR.
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
