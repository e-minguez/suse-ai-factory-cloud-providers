---
# Weekly update PRs. Actions are pinned to commit SHAs in .github/workflows; dependabot
# bumps the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /tools/cost
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /tools/webui
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /tools/webui
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      images:
        patterns: ["*"]
