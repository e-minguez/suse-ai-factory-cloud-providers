metadata:
  name: suse-ai-factory
  # Comment lines are dropped when the manifest is rewritten.
  version: 2.3.0
corePlatform:
  image: registry.suse.com/elemental/rke2/rke2-manifest:1.35.6-48.1
components:
  systemd:
    extensions:
      - name: "suse-storage"
        image: "registry.suse.com/elemental/longhorn:4.111-4.79"
  helm:
    charts:
      - chart: "cert-manager"
        version: "v1.21.0"
        namespace: "cert-manager"
        repository: "jetstack"
      - chart: "rancher"
        version: "2.14.3"
        namespace: "cattle-system"
        repository: "rancher-prime"
        dependsOn:
          - name: "cert-manager"
            type: "helm"
        values:
          replicas: 1
          global:
            psp:
              enabled: "false"
